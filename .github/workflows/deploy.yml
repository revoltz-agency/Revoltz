# Builds the public marketing website and publishes it to GitHub Pages.
#
# This workflow publishes a dedicated public-marketing entry point. It does
# not bundle or route to the internal AgencyOS application. The website is
# static; its interactive examples run locally in the visitor's browser.
#
# GitHub Pages is configured in repository Settings -> Pages with Source =
# "GitHub Actions".
# Site URL: https://revoltz-agency.github.io/Revoltz/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; superseded runs are cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Pages base path
        # Pages serves this repository at /Revoltz/, so asset URLs and the
        # marketing site's root link must use that base. Local/Express builds
        # keep the default '/' base from vite.config.js.
        # The Vite config swaps index.html to the marketing-only React entry.
        # No AgencyOS code or /agencyos route is part of this Pages artifact.
        run: VITE_PUBLIC_SITE_ONLY=true npm run build -- --base=/Revoltz/

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
