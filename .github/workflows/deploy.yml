# Builds the Vite SPA and publishes it to GitHub Pages.
#
# This temporary public testing deployment includes the AgencyOS frontend.
# Do not enter sensitive/customer data. GitHub Pages is static hosting only;
# Express backend features will not work until a separate backend is deployed.
#
# GitHub Pages is configured in repository Settings -> Pages with Source =
# "GitHub Actions".
# Site URL: https://revoltz-agency.github.io/Revoltz/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; superseded runs are cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Pages base path
        # Pages serves this repository at /Revoltz/, so asset URLs and the
        # client router base must match it. Local/Express builds keep the
        # default '/' base from vite.config.js.
        run: VITE_PUBLIC_SITE_ONLY=false npm run build -- --base=/Revoltz/

      - name: Add SPA fallback for history routing
        # GitHub Pages has no SPA rewrite rule; a 404.html copy of index.html
        # lets deep links such as /agencyos load the frontend bundle.
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
